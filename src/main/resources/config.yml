# Dash Admin Dashboard Configuration

# Web server port for the admin dashboard
port: 8080

# NeoBridge slave-mode integration for NeoDash master panel
bridge:
  enabled: true
  secret: ""
  master_url: ""

# Read-only API for other plugins and external tools.
# Disabled by default: turn it on deliberately, then create a key in the panel.
# Keys are stored as SHA-256 hashes in api-keys.txt and shown only once.
api:
  enabled: false
  rate-limit-per-minute: 120

# Experimental sections shown only when Beta is enabled in Settings.
beta:
  enabled: false

# Database settings for player data tracking
database:
  type: sqlite
  file: dash.db

# Backup settings
backups:
  directory: backups
  max-backups: 10

# Optional host/IP used for IP-based setup links when Panel URL is blank.
server-ip: ""

# Use the Panel URL as the browser-facing HTTPS URL for setup and NeoDash bridge redirects.
ssl-enabled: false

# Optional public base URL for clickable setup links (e.g. https://panel.example.com)
panel-url: ""

# Sub-path the panel is served under when it sits behind a reverse proxy,
# e.g. "/admin" for https://example.org/admin/. Leave blank when the panel is
# served at the root. Every link, form target and asset URL is prefixed with
# this value. The proxy is expected to strip the prefix before forwarding
# (nginx: proxy_pass http://127.0.0.1:PORT/ with the trailing slash; Traefik:
# the StripPrefix middleware). When left blank, an X-Forwarded-Prefix header
# sent by the proxy is honoured instead.
base-path: ""


# Optional public URL of this plugin dashboard used only for anonymous report links.
# Leave blank to derive it from server-ip, ssl-enabled and the local web port.
report-url: ""

# Optional Discord webhook for setup-required notifications
setup-discord-webhook-url: ""

# Legacy single Discord webhook field (kept for compatibility)
discord:
  webhook_url: ""

# Discord webhooks for event notifications
# Each entry has a URL and a list of subscribed events:
# audit, chat, server_start_stop, console_warnings, sso_requests
discord-webhooks: []
# Example:
# discord-webhooks:
#   - url: "https://discord.com/api/webhooks/..."
#     events:
#       - audit
#       - server_start_stop
#       - sso_requests

# GitHub updater (public repository)
updater:
  github-repo: "Framepersecond/Dash"

