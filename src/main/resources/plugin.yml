name: Dash
version: '4.5.1'
main: dash.Dash
api-version: '1.21'
author: Frxme
description: Server admin dashboard with web interface
softdepend: [CoreProtect]
commands:
  dash:
    description: Dash admin commands
    usage: '/dash ticket | /dash report [player] | /dash ui | /dash register [user] [rank] | /dash update'
permissions:
  dash.register:
    description: Allows generating web registration codes
    default: op
